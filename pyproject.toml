[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "item-appraiser"
version = "0.1.0"
description = "Estimate the value of household goods being lent and given away"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
item-appraiser-eval = "item_appraiser.evaluate:main"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
