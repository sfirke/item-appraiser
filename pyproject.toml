[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "item-appraiser"
version = "0.1.0"
description = "Estimate the new price, buy value and loan value of household goods with an LLM"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sam Firke", email = "samuel.firke@gmail.com" }]
keywords = ["appraisal", "valuation", "secondhand", "lending", "llm", "claude", "deepseek"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# The core (data types, value policy, prompt) has no dependencies; each model
# provider is an extra.
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.3"]
deepseek = ["openai>=3"]

# Local-only tooling; not published as an extra. Install with:
#   pip install -e '.[claude,deepseek]' --group dev
[dependency-groups]
dev = ["python-dotenv", "pytest", "ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/sfirke/item-appraiser"
Repository = "https://github.com/sfirke/item-appraiser"
Issues = "https://github.com/sfirke/item-appraiser/issues"
Changelog = "https://github.com/sfirke/item-appraiser/blob/main/CHANGELOG.md"

[project.scripts]
item-appraiser-eval = "item_appraiser.evaluate:main"

# List what ships explicitly, so local files (.env, data/, caches) never reach PyPI.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
