name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[claude]' --group dev
      - run: ruff check .
      - run: ruff format --check src tests
      - run: pytest

  core-without-extras:
    # The core must import and work without the anthropic package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install .
      - run: |
          python -c "
          from item_appraiser import Appraisal, Condition, buy_value, __version__
          assert Appraisal(100, Condition.USED).buy_value_usd == 60
          print('core OK', __version__)
          "

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
